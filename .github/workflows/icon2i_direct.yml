# Gira nel repo pubblico crinale-sito (minuti gratis) con il codice del repo privato crinaleappennino.
# Copia di .github/workflows del repo privato (tools/public_workflows): modificare l'originale nel repo privato.
name: ICON-2I da MeteoHub (in ombra)
# Ogni 20 minuti nelle finestre in cui escono le corse (00z → ~02-04 UTC, 12z → ~13-16 UTC), più a mano.
# Scarica ICON-2I direttamente da MeteoHub (ItaliaMeteo-ARPAE, CC BY 4.0) sui nostri punti e lo confronta con
# Open-Meteo. Non tocca il sito né il motore: vedi pipeline/icon2i_direct.py.
on:
  schedule:
    - cron: "5,25,45 1-8 * * *"
    - cron: "5,25,45 13-20 * * *"
  workflow_dispatch:
concurrency:
  group: icon2i-direct
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  icon2i:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enricom87/crinaleappennino
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install requests eccodes
          python -c "import eccodes; print('ecCodes', eccodes.codes_get_api_version())"
      - name: Scarica e confronta
        timeout-minutes: 35
        run: python pipeline/icon2i_direct.py
      - name: Salva
        if: always()
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/icon2i_direct.json data/icon2i_avail.json data/icon2i_compare.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ICON-2I MeteoHub $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs && sleep 3; done
