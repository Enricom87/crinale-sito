# Gira nel repo pubblico crinale-sito (minuti gratis) con il codice del repo privato crinaleappennino.
# Copia di .github/workflows del repo privato (tools/public_workflows): modificare l'originale nel repo privato.
name: Radiosondaggi (uso interno)
# San Pietro Capofiume 00z e 12z, per la taratura del motore. Non tocca il sito: vedi pipeline/radiosondaggio.py.
on:
  workflow_dispatch:
  schedule:
    - cron: "35 3,15 * * *"
concurrency:
  group: radiosondaggio
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enricom87/crinaleappennino
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pipeline/radiosondaggio.py 2
      - name: Salva
        if: always()
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radiosondaggi 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Radiosondaggi $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs && sleep 3; done
