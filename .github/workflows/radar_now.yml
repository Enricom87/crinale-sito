# Gira nel repo pubblico crinale-sito (minuti gratis) con il codice del repo privato crinaleappennino.
# Copia di .github/workflows del repo privato (tools/public_workflows): modificare l'originale nel repo privato.
name: Radar sui punti (in ombra)
# Lo lancia il bot ogni 10 minuti (il cron di GitHub qui è solo una riserva). Radar-DPC (CC BY-SA 4.0):
# intensità adesso, ultima ora e prossime 2 ore per punto. Non tocca il sito: vedi pipeline/radar_now.py.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: radar-now
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enricom87/crinaleappennino
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy rasterio
      - name: Radar
        timeout-minutes: 10
        run: python pipeline/radar_now.py
      - name: Salva
        if: always()
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar_now.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Radar $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs && sleep 3; done
