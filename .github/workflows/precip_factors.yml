# Gira nel repo pubblico crinale-sito (minuti gratis) con il codice del repo privato crinaleappennino.
# Copia di .github/workflows del repo privato (tools/public_workflows): modificare l'originale nel repo privato.
name: Fattori pioggia dallo storico
# Lancio a mano. Confronta la pioggia misurata (Arpae, CC BY 4.0) con quella prevista modello per modello
# (Open-Meteo Historical Forecast) e scrive data/hindcast/precip_factors.json per le varianti in ombra.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fattori:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enricom87/crinaleappennino
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Calcola i fattori
        continue-on-error: true
        run: python pipeline/hindcast/precip_factors.py
      - name: Salva
        if: always()
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hindcast/precip_factors.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fattori pioggia dallo storico $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs && sleep 3; done
