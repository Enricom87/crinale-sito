# Gira nel repo pubblico crinale-sito (minuti gratis) con il codice del repo privato crinaleappennino.
# Copia di .github/workflows del repo privato (tools/public_workflows): modificare l'originale nel repo privato.
name: Terreno dei punti (uso interno)
# Conche, chiusura, sole d'inverno, esposizione e scolo di ogni punto e stazione dal modello del terreno Copernicus
# GLO-30. Si lancia a mano quando cambiano i punti. Non tocca il sito: vedi pipeline/terreno.py.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  terreno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Enricom87/crinaleappennino
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy rasterio
      - run: python pipeline/terreno.py
      - name: Salva
        if: always()
        run: |
          git config user.name "crinale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/terreno.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Terreno dei punti $(date -u +%F_%H%M)"
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs && sleep 3; done
